server:
  port: 8080

spring:
  datasource:
    # 容器里通过 MYSQL_HOST 注入服务名；本地默认 localhost
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:logpilot}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:logpilot}
    password: ${MYSQL_PASSWORD:logpilot}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false

logging:
  level:
    com.logpilot: debug
